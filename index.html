<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centurion Way Solar System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="prefetch" href="planets/sun.html">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <!-- UIkit -->
    <link rel="stylesheet" href="/solarsystem-master/css/uikit.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/intro.css">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>



<body class="intro-page">

    <div id="pageContainer">
        <div class="sun-transition" id="sunTransition"></div>

        <!-- Site header -->
        <header id="site-header"></header>

        <section class="intro">

            <div class="starfield" id="starfield"></div>

            <div class="solar-zoom" id="solarZoom">
                <div class="solar-system" id="solarSystem">

                    <!-- Orbits -->
                    <div class="orbit" style="width:120px;height:120px;animation-duration:6s;">
                        <div class="orbit-arm"><img src="images/mercuryPlanet.png" class="planet" style="width:10px;"></div>
                    </div>

                    <div class="orbit" style="width:170px;height:170px;animation-duration:8s;">
                    <div class="orbit-arm"><img src="images/venusPlanet.png" class="planet" style="width:16px;"></div>
                    </div>

                    <div class="orbit" style="width:220px;height:220px;animation-duration:10s;">
                        <div class="orbit-arm"><img src="images/earthPlanet.png" class="planet" style="width:18px;"></div>
                    </div>

                    <div class="orbit" style="width:270px;height:270px;animation-duration:12s;">
                        <div class="orbit-arm"><img src="images/marsPlanet.png" class="planet" style="width:14px;"></div>
                    </div>

                    <div class="orbit" style="width:340px;height:340px;animation-duration:18s;">
                        <div class="orbit-arm"><img src="images/jupiterPlanet.png" class="planet" style="width:40px;"></div>
                    </div>

                    <div class="orbit" style="width:410px;height:410px;animation-duration:22s;">
                        <div class="orbit-arm"><img src="images/saturnPlanet.png" class="planet" style="width:36px;"></div>
                    </div>

                    <div class="orbit" style="width:480px;height:480px;animation-duration:26s;">
                        <div class="orbit-arm"><img src="images/uranusPlanet.png" class="planet" style="width:26px;"></div>
                    </div>

                    <div class="orbit" style="width:550px;height:550px;animation-duration:30s;">
                    <div class="orbit-arm"><img src="images/neptunePlanet.png" class="planet" style="width:24px;"></div>
                    </div>

                    <div class="orbit" style="width:600px;height:600px;animation-duration:34s;">
                        <div class="orbit-arm"><img src="images/plutoPlanet.png" class="planet" style="width:8px;"></div>
                    </div>

                    <div class="sun-stage" id="sunStage">

                    <model-viewer
                        id="sunModelIntro"
                        src="models/sun.glb"
                        alt="Sun"
                        auto-rotate
                        camera-controls="false"
                        disable-zoom
                        interaction-prompt="none"
                        class="sun-model">
                    </model-viewer>

                    </div>

                </div>
            </div>
            <div class="intro-text">
                <h1>Centurion Way Solar System</h1>
                <p>Tap the Sun to begin your space adventure ☀️</p>
            </div>

        </section>

            <iframe id="sunFrame"
                    src="planets/sun.html"
                    style="
                    position:fixed;
                    inset:0;
                    width:100%;
                    height:100%;
                    border:none;
                    opacity:0;
                    z-index:9998;">
            </iframe>


            <script src="js/uikit.min.js"></script>
            <script src="js/uikit-icons.min.js"></script>
            <script src="js/intro.js"></script>
            <script src="js/partials.js"></script>
            <script>
                const sunFrame = document.getElementById("sunFrame");

                window.addEventListener("message", (event) => {

                if (event.data?.type === "sunModelReady") {

                    console.log("Sun model fully loaded");

                    // small delay for safety / smoothness
                    setTimeout(() => {

                    document.body.classList.add("fade-out-index");
                    sunFrame.classList.add("visible");

                    }, 1000);

                }

                });
            </script>

    </div>
</body>
</html>
