<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centurion Way Solar System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/intro.css">
</head>

<body class="fade-in">

<section class="intro">

    <div class="starfield" id="starfield"></div>
    <div class="shooting-star" id="shootingStar"></div>

    <div class="solar-system" id="solarSystem">

        <!-- Orbits (Mercury pushed out slightly) -->
        <div class="orbit" data-speed="6" style="width:150px;height:150px;">
            <img src="images/mercuryPlanet.png" class="planet" style="width:10px;">
        </div>

        <div class="orbit" data-speed="8" style="width:200px;height:200px;">
            <img src="images/venusPlanet.png" class="planet" style="width:16px;">
        </div>

        <div class="orbit" data-speed="10" style="width:250px;height:250px;">
            <img src="images/earthPlanet.png" class="planet" style="width:18px;">
        </div>

        <div class="orbit" data-speed="12" style="width:300px;height:300px;">
            <img src="images/marsPlanet.png" class="planet" style="width:14px;">
        </div>

        <div class="orbit" data-speed="18" style="width:370px;height:370px;">
            <img src="images/jupiterPlanet.png" class="planet" style="width:40px;">
        </div>

        <div class="orbit" data-speed="22" style="width:440px;height:440px;">
            <img src="images/saturnPlanet.png" class="planet" style="width:36px;">
        </div>

        <div class="orbit" data-speed="26" style="width:510px;height:510px;">
            <img src="images/uranusPlanet.png" class="planet" style="width:26px;">
        </div>

        <div class="orbit" data-speed="30" style="width:580px;height:580px;">
            <img src="images/neptunePlanet.png" class="planet" style="width:24px;">
        </div>

        <div class="orbit" data-speed="34" style="width:640px;height:640px;">
            <img src="images/plutoPlanet.png" class="planet" style="width:8px;">
        </div>

        <!-- Smaller Sun -->
        <img src="images/sunPlanet.png" class="sun" id="sunTrigger">

    </div>

    <div class="intro-text">
        <h1>Centurion Way Solar System</h1>
        <p>Tap the Sun to begin your space adventure ☀️</p>
    </div>

</section>

<script src="js/intro.js"></script>
</body>
</html>
